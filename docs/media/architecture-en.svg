<text x="40" y="628" font-size="13" font-weight="700" fill="#467365">LOCAL DATA BOUNDARY</text>
<text x="40" y="654" font-size="14" fill="#54665e">No plugin telemetry or upload endpoint.</text>
<text x="40" y="677" font-size="14" fill="#54665e">Raw chat text is not stored in ledgers.</text>
