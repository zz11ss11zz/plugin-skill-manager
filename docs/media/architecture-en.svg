<text x="827" y="230">Activity · Manage · Environment health</text><text x="827" y="255">MCP Apps UI resources + tools</text><text x="827" y="280">Displayed inside the host</text>
<text x="827" y="430">Setup and inspection instructions</text><text x="827" y="455">Explicit Skill adoption reports</text><text x="827" y="480">Explicit plugin call reports</text><text x="827" y="508">Tools invoked through the host</text>
