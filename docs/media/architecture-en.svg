<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="790" viewBox="0 0 1160 790" role="img" aria-labelledby="title desc">
<title id="title">Plugin and Skill Manager architecture</title>
<desc id="desc">Local directories, installed-plugin discovery and opt-in session events feed a Node.js MCP service. The Codex host accesses tools and UI resources over stdio. Separate local ledgers hold host calls, assistant reports and Skill adoptions. Management changes use previews and explicit authorization.</desc>
