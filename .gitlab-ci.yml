# GitLab CI/CD pipeline.
#
#   check    deps:lockfile      the committed lockfile is deduplicated and satisfies the policy
#   audit    deps:audit         no high/critical advisories            (after deps:lockfile)
#            deps:licenses      production licenses on the allowlist   (after deps:lockfile)
#            secret_detection   GitLab secret scanning                 (independent)
#            semgrep-sast       GitLab static analysis                 (independent)
#   test     test:node          node:test suites under test/, JUnit report in the Tests tab
#                                                                      (after deps:lockfile)
#   package  package:plugin-codex  manual; builds the Codex plugin bundle as an artifact
#                                  (after test:node, deps:audit, deps:licenses and the scanners)
#
#   deps:lockfile ─┬─▶ deps:audit ────┐
#                  ├─▶ deps:licenses ─┤
#                  └─▶ test:node ─────┼─▶ package:plugin-codex (manual)
#   secret_detection ─────────────────┤
#   semgrep-sast ─────────────────────┘
#
# Contract, architecture and type checks are not run here; `pnpm run verify` runs them locally.
# Pipelines never publish or deploy.

stages:
  - check
  - audit
  - test       # also the default stage of any other job the included templates add
  - package

include:
  # GitLab-maintained scanners (available on all tiers); their jobs are moved to `audit` below.
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch pipelines while a merge request is open.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  timeout: 30 minutes

variables:
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

# ---- shared setup --------------------------------------------------------------------------------
# pnpm version comes from package.json#packageManager; the lockfile is authoritative and the
# supply-chain policy lives in pnpm-workspace.yaml.
.pnpm:
  before_script:
    - node --version
    - PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
    - npm install --global --no-fund --no-audit "pnpm@${PNPM_VERSION}"
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
      prefix: pnpm-$CI_JOB_IMAGE
    paths: [.pnpm-store/]

.linux:
  extends: .pnpm
  image: node:24.22.1-bookworm-slim

# ---- check ---------------------------------------------------------------------------------------
check:lockfile:
  stage: check
  extends: .linux
  needs: []
  script:
    # The committed lockfile must already be deduplicated and satisfy the supply-chain policy.
    - pnpm dedupe --check

# ---- audit ---------------------------------------------------------------------------------------
deps:audit:
  stage: audit
  extends: .linux
  needs: [deps:lockfile]
  script:
    # Fails on known high or critical vulnerabilities in the locked dependency tree.
    - pnpm audit --audit-level high

deps:licenses:
  stage: audit
  extends: .linux
  needs: [deps:lockfile]
  script:
    - pnpm licenses list --prod --json > licenses.json
    - node scripts/check-licenses.mjs licenses.json
  artifacts:
    when: always
    paths: [licenses.json]
    expire_in: 1 week

# Template jobs: only stage and dependencies are overridden; scanning reads source, not dependencies.
secret_detection:
  stage: audit
  needs: []

semgrep-sast:
  stage: audit
  needs: []

# ---- test ----------------------------------------------------------------------------------------
test:node:
  stage: test
  extends: .linux
  needs: [deps:lockfile]
  script:
    # Package and protocol tests load the built dashboard (dist/dashboard.html).
    - node scripts/build.mjs
    - node scripts/test.mjs --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    expire_in: 1 week

# ---- package -------------------------------------------------------------------------------------
package:plugin-codex:
  stage: package
  extends: .linux
  needs:
    - test:node
    - deps:audit
    - deps:licenses
    # Scanner jobs may be absent (e.g. disabled with SAST_DISABLED / SECRET_DETECTION_DISABLED).
    - job: secret_detection
      optional: true
    - job: semgrep-sast
      optional: true
  rules:
    # Available on every branch, tag and merge request pipeline; runs only when triggered.
    - when: manual
      # A pipeline that nobody packages still counts as passed.
      allow_failure: true
  script:
    - VERSION="$(node -p "require('./package.json').version")"
    - pnpm run build:plugin
    - test -f "dist/plugin-${VERSION}/server/src/server.mjs"
  artifacts:
    name: "plugin-skill-manager-$CI_COMMIT_REF_SLUG"
    paths: [dist/plugin-*/]
    expire_in: 1 week
