# GitLab CI/CD pipeline.
#
#   test     the node:test suites under test/ (results shown in the pipeline's Tests tab),
#            dependency audit, lockfile hygiene, license allowlist, GitLab SAST and secret detection.
#   package  a manual job on every pipeline that builds the Codex plugin bundle as a downloadable
#            artifact once the tests and dependency checks have passed.
#
# Contract, architecture and type checks are not run here; `pnpm run verify` runs them locally.
# Pipelines never publish or deploy.

stages:
  - test
  - package

include:
  # GitLab-maintained scanners (available on all tiers); they add jobs to the `test` stage.
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch pipelines while a merge request is open.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  timeout: 30 minutes

variables:
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

# ---- shared setup --------------------------------------------------------------------------------
# pnpm version comes from package.json#packageManager; the lockfile is authoritative and the
# supply-chain policy lives in pnpm-workspace.yaml.
.pnpm:
  before_script:
    - node --version
    - PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
    - npm install --global --no-fund --no-audit "pnpm@${PNPM_VERSION}"
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
      prefix: pnpm-$CI_JOB_IMAGE
    paths: [.pnpm-store/]

.linux:
  extends: .pnpm
  image: node:24.22.1-bookworm-slim

# ---- test: test suites, dependency and repository checks -----------------------------------------
test:node:
  stage: test
  extends: .linux
  needs: []
  script:
    # Package and protocol tests load the built dashboard (dist/dashboard.html).
    - node scripts/build.mjs
    - node scripts/test.mjs --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    expire_in: 1 week

deps:audit:
  stage: test
  extends: .linux
  needs: []
  script:
    # Fails on known high or critical vulnerabilities in the locked dependency tree.
    - pnpm audit --audit-level high

deps:lockfile:
  stage: test
  extends: .linux
  needs: []
  script:
    # The committed lockfile must already be deduplicated and satisfy the supply-chain policy.
    - pnpm dedupe --check

deps:licenses:
  stage: test
  extends: .linux
  needs: []
  script:
    - pnpm licenses list --prod --json > licenses.json
    - node scripts/check-licenses.mjs licenses.json
  artifacts:
    when: always
    paths: [licenses.json]
    expire_in: 1 week

# ---- package: manual, after the tests and dependency checks --------------------------------------
package:plugin-codex:
  stage: package
  extends: .linux
  needs:
    - test:node
    - deps:audit
    - deps:lockfile
    - deps:licenses
  rules:
    # Available on every branch, tag and merge request pipeline; runs only when triggered.
    - when: manual
      # A pipeline that nobody packages still counts as passed.
      allow_failure: true
  script:
    - VERSION="$(node -p "require('./package.json').version")"
    - pnpm run build:plugin
    - test -f "dist/plugin-${VERSION}/server/src/server.mjs"
  artifacts:
    name: "plugin-skill-manager-$CI_COMMIT_REF_SLUG"
    paths: [dist/plugin-*/]
    expire_in: 1 week
