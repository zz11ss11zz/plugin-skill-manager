# Single source of truth for dependency versions and supply-chain policy.
# Edit versions only here; package.json refers to them with "catalog:".
# Upgrade procedure: docs/dev/DEPENDENCIES.md

packages:
  - .

catalog:
  # Runtime (bundled into the shipped server / dashboard)
  "@modelcontextprotocol/sdk": 1.32.1
  "@modelcontextprotocol/ext-apps": 1.7.5
  zod: 4.6.7
  yaml: 2.9.1
  acorn: 8.19.0
  smol-toml: 1.9.1
  # Build and verification only
  esbuild: 0.28.2
  typescript: 5.9.3
  "@types/node": 24.19.2

# Refuse versions published less than 7 days ago (minutes).
minimumReleaseAge: 10080

# Fail when a package's provenance/trust level drops compared with earlier releases.
trustPolicy: no-downgrade

# Only explicitly approved packages may run install/build scripts; everything else is blocked.
allowBuilds:
  esbuild: true
strictDepBuilds: true

# Exact versions only; engines must match.
savePrefix: ""
engineStrict: true
