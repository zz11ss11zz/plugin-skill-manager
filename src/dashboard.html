<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plugin &amp; Skill Manager</title>
<style>
.source-tabs{width:fit-content;margin:12px 0}.activity-quality{margin:12px 0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.activity-quality p{margin:3px 0;line-height:1.6}
:root{color-scheme:light dark;--paper:#ffffff;--surface:#f5f7f6;--ink:#202a27;--muted:#65736e;--line:#d8e0dc;--line-soft:#edf1ef;--input-line:#a9b7b0;--accent:#2d6b59;--accent-soft:#e8f1ed;--focus:#214f42;--heat-0:#f0f3f2;--heat-1:#d4e7e1;--heat-2:#9ac5b7;--heat-3:#5c9c89;--heat-4:#2d6b59}
@media(prefers-color-scheme:dark){:root{--paper:#1e2422;--surface:#272f2c;--ink:#e9efec;--muted:#adbdb5;--line:#414f48;--line-soft:#303b35;--input-line:#70837a;--accent:#9ecdbb;--accent-soft:#2d4239;--focus:#b2ddcd;--heat-0:#28322d;--heat-1:#355346;--heat-2:#4e7f6a;--heat-3:#7bb39b;--heat-4:#b0dbc7}}
@media(prefers-reduced-motion:reduce){button{transition:none}}

:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--surface)}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:32px 24px}header{border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:28px;margin:8px 0}h2{font-size:18px;margin:0}p{line-height:1.7}small{color:var(--accent);font-weight:600;letter-spacing:.08em}.notice{padding:14px 18px;background:#fff4dd;color:#71420d;border-left:3px solid #925b12}#status{color:var(--muted);font-size:14px}ul{list-style:none;padding:0}li{padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:8px;margin:12px 0}li p{margin:8px 0 0}footer{font-size:13px;color:var(--muted)}@media(max-width:420px){main{padding:20px 14px}h1{font-size:24px}}
input,select{display:block;width:100%;padding:10px 12px;margin:6px 0 16px;border:1px solid var(--input-line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}details{margin-top:14px}summary{cursor:pointer;color:var(--accent)}details p{overflow-wrap:anywhere;font-size:13px}input:focus,select:focus,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font:inherit;font-size:13px;font-weight:500;line-height:20px;cursor:pointer;transition:background-color .12s,border-color .12s}
button:not(.heat-cell):not(.activity-bar):hover:not(:disabled){background:var(--surface);border-color:var(--input-line)}button:not(.heat-cell):not(.activity-bar):active:not(:disabled){background:var(--accent-soft)}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#management-plan p,#archives p{overflow-wrap:anywhere}
textarea{display:block;width:100%;min-height:90px;margin:8px 0;padding:10px;font:inherit;border:1px solid var(--input-line);border-radius:6px}input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 12px 0}textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
body{background:var(--paper)}main{max-width:1040px}header{padding-bottom:16px;margin-bottom:28px}header small{display:none}
#activity-panel{margin:0 0 32px}.activity-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.activity-heading h2{margin-right:auto;font-size:20px}.activity-tabs{display:flex;gap:4px;background:var(--surface);border-radius:8px;padding:4px}.activity-tabs button{border:0;min-height:30px;background:transparent;color:var(--muted);padding:7px 15px}.activity-tabs button[aria-pressed=true]{background:var(--paper);color:var(--accent);box-shadow:0 1px 2px #0000000a}.activity-heading select{width:auto;margin:0;padding:7px 9px;font-size:13px}.activity-caption,.activity-note{font-size:12px;color:var(--muted);line-height:1.7}.calendar-scroll{overflow-x:auto;padding:8px 0}.activity-calendar{min-width:792px;max-width:792px}.calendar-months{display:grid;grid-template-columns:repeat(var(--weeks),12px);column-gap:3px;height:24px;font-size:11px;color:var(--muted)}.calendar-months span{overflow:visible;white-space:nowrap}.calendar-cells{display:grid;grid-template-rows:repeat(7,12px);grid-template-columns:repeat(var(--weeks),12px);grid-auto-flow:column;gap:3px}.heat-cell,.heat-empty,.heat-swatch{border-radius:3px;min-width:0;padding:0;border:0}.heat-cell{display:block;width:100%;height:12px;min-height:0;cursor:pointer;transition:none}.heat-cell:hover:not(:disabled){outline:2px solid var(--focus);outline-offset:1px}.level-0{background:var(--heat-0)}.level-1{background:var(--heat-1)}.level-2{background:var(--heat-2)}.level-3{background:var(--heat-3)}.level-4{background:var(--heat-4)}.heat-unknown{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 3px,var(--line) 3px,var(--line) 4px)}.activity-tooltip{font-size:12px;min-height:21px;color:var(--muted);margin:8px 0}.activity-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;color:var(--muted);font-size:11px}.heat-swatch{display:inline-block;width:12px;height:12px}.activity-legend span:last-child{margin-left:14px}.activity-rankings{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:26px}.activity-rankings h3{font-size:14px;font-weight:600;margin:0 0 12px}.activity-ranking{list-style:none;padding:0;margin:0}.activity-ranking li{display:flex;align-items:center;gap:10px;padding:10px 0;margin:0;border:0;border-radius:0;border-bottom:1px solid var(--line-soft);min-width:0}.activity-avatar{display:grid;place-items:center;flex:0 0 34px;height:34px;border:1px solid var(--line);border-radius:9px;color:var(--accent);background:var(--surface);font-size:12px;font-weight:600}.activity-ranking li>div{min-width:0;flex:1}.activity-ranking strong{display:block;font-size:13px;overflow-wrap:anywhere}.ranking-detail{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.ranking-count{font-size:12px;white-space:nowrap;color:var(--accent)}@media(max-width:600px){.activity-rankings{grid-template-columns:1fr;gap:22px}.activity-heading h2{width:100%}.activity-caption{max-width:100%}}
.entity-panel{margin-top:26px;padding-top:20px;border-top:1px solid var(--line-soft)}.entity-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.entity-heading h3{margin:0;font-size:15px}.entity-dates{display:flex;gap:10px;flex-wrap:wrap}.entity-dates label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.entity-dates input{width:auto;margin:0;padding:6px 8px;font-size:12px}.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,20px);gap:5px;margin-top:14px}.entity-cell{height:20px;width:20px}.entity-cell:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.manager-nav{display:flex;gap:6px;margin:-10px 0 24px;border-bottom:1px solid var(--line);padding-bottom:12px}.manager-nav button{border-color:transparent;background:transparent;color:var(--muted)}.manager-nav button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}.manager-body>button{margin:4px 8px 8px 0}.manager-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.manager-actions{display:flex;gap:8px;flex-wrap:wrap}.manager-body>p{font-size:14px;color:var(--muted);max-width:76ch}.manager-filters{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}.manager-meta{font-size:12px;color:var(--muted)}.manager-list h3{margin:0;font-size:16px}.manager-list details button,.manager-plan button{margin:8px 8px 0 0}.manager-plan{border-left:3px solid var(--accent);padding:14px 18px;background:var(--accent-soft);margin:16px 0}.manager-plan p,.archive-row p{overflow-wrap:anywhere;font-size:13px}.archive-row{padding:16px 0;border-bottom:1px solid var(--line)}.manager-feedback{font-size:13px;overflow-wrap:anywhere}.manager-feedback:empty{display:none}[hidden]{display:none!important}@media(max-width:600px){.manager-filters{grid-template-columns:1fr;gap:0}}
.observation-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.observation-heading h3{margin:0}.observation-check{flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;line-height:1.5;min-height:26px}.observation-check:hover{background:var(--surface);color:var(--muted)}.observation-state{font-size:13px;font-weight:600;margin:0 0 4px}.usage-observation>.activity-caption{margin:0 0 12px}.usage-observation>details{margin-top:10px;font-size:12px}.usage-observation>.activity-note{margin:8px 0;font-size:11px}.observation-rules summary{color:var(--muted);font-size:11px}.observation-feedback{font-size:12px;color:var(--muted)}.observation-feedback:empty{display:none}
.inventory-filters{flex-wrap:wrap}.source-count::before{content:" · "}.source-count{font-variant-numeric:tabular-nums}.inventory-search{display:block}.inventory-search input{width:100%;box-sizing:border-box}.manager-toolbar h2{margin:0}.manager-toolbar{margin-bottom:12px}.manager-list{margin-top:8px}.manager-list>li{border:0;border-bottom:1px solid var(--line-soft);border-radius:0;padding:18px 0;margin:0}.manager-list>li p{font-size:13px}.manager-list h3{font-size:15px}.manager-list .manager-meta{font-size:12px}.manager-list+ h2{margin-top:28px}@media(max-width:600px){.manager-filters{grid-template-columns:1fr;gap:4px}.source-summary .source-choice{font-size:13px;padding:12px 10px}.source-summary th{padding-left:10px;padding-right:10px}.source-list-heading{margin-bottom:8px}}

/* v0.4: quiet teal activity, shared daily selection and responsive summaries. */
.activity-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:26px 0 30px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.activity-metric{min-width:0;border-right:1px solid var(--line);padding-right:18px}.activity-metric:last-child{border:0}.activity-metric>span{display:block;color:var(--muted);font-size:12px;line-height:1.6}.activity-metric>strong{display:block;margin-top:8px;font-size:30px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}
.recent-activity{margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line-soft)}.recent-heading,.daily-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.recent-heading h3,.year-heading,.daily-heading h3{font-size:15px;font-weight:600;margin:0}.recent-activity>p{margin:8px 0 18px}
.recent-chart{display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-rows:132px 22px;gap:8px 10px}.recent-yaxis{display:flex;flex-direction:column;justify-content:space-between;text-align:right;color:var(--muted);font-size:10px;line-height:1}.recent-plot{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr));gap:5px;align-items:end;border-bottom:1px solid var(--line);background:linear-gradient(var(--line-soft),var(--line-soft)) 0 0/100% 1px no-repeat,linear-gradient(var(--line-soft),var(--line-soft)) 0 50%/100% 1px no-repeat}
.activity-bar{display:flex;align-items:flex-end;justify-content:center;height:100%;width:100%;min-width:0;min-height:0;padding:0 2px;border:0;border-radius:2px;background:transparent;cursor:pointer;box-shadow:none}.bar-fill{display:block;pointer-events:none;width:100%;max-width:18px;background:var(--heat-3);border-radius:2px 2px 0 0}.activity-bar:hover .bar-fill,.activity-bar[aria-pressed=true] .bar-fill{background:var(--heat-4)}.activity-bar:hover{background:var(--accent-soft)}.activity-bar:focus-visible{outline-offset:1px}.bar-unknown .bar-fill{background:repeating-linear-gradient(135deg,var(--paper),var(--paper) 2px,var(--input-line) 2px,var(--input-line) 3px)}.bar-zero .bar-fill{background:var(--line)}
.recent-xaxis{display:grid;grid-column:2;grid-template-columns:repeat(var(--days),minmax(0,1fr));gap:5px;font-size:10px;color:var(--muted)}.recent-xaxis span{white-space:nowrap}.recent-xaxis span:last-child{justify-self:end}.year-heading{margin:0 0 14px}.calendar-scroll{padding:4px 3px 8px}.heat-future{background:var(--heat-0);opacity:.35}.heat-unknown{background:repeating-linear-gradient(135deg,var(--paper),var(--paper) 3px,var(--line-soft) 3px,var(--line-soft) 4px)}
.daily-ranking{border-top:1px solid var(--line-soft);padding-top:20px;margin-top:18px}.daily-heading{margin-bottom:12px}.clear-day{font-size:12px;flex-shrink:0}.daily-list{max-height:420px;overflow-y:auto}.daily-list>li{padding:12px 0}.ranking-position{color:var(--muted);font-size:12px;width:24px;font-variant-numeric:tabular-nums}.ranking-track{display:block;margin-top:8px;height:4px;border-radius:2px;background:var(--surface)}.ranking-fill{display:block;height:100%;border-radius:2px;background:var(--heat-3)}.daily-empty{color:var(--muted);font-size:13px}
@media(max-width:600px){.activity-metrics{gap:12px;margin-top:20px}.activity-metric{padding-right:8px}.activity-metric>span{font-size:11px;min-height:3.2em}.activity-metric>strong{font-size:26px}.recent-chart{grid-template-rows:112px 22px;grid-template-columns:22px minmax(0,1fr);column-gap:6px}.recent-plot,.recent-xaxis{gap:2px}.activity-bar{padding:0}.recent-heading{align-items:baseline}.recent-heading>.activity-caption{font-size:11px}.daily-heading h3{font-size:13px}}
.manager-actions button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}.manager-list details p{overflow-wrap:anywhere}
.plugin-heading{display:flex;align-items:center;gap:12px}.plugin-heading h3{min-width:0;overflow-wrap:anywhere}.plugin-icon{position:relative;display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;box-sizing:border-box;border:1px solid var(--line-soft);border-radius:10px;background:transparent;color:var(--accent);font-size:17px;font-weight:600;overflow:hidden}.plugin-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.plugin-icon picture{display:contents}.plugin-icon[data-openai-mark=true] img{transform:scale(2)}
</style></head><body><main>
<header><small>PLUGIN &amp; SKILL MANAGER / LOCAL</small><h1>Plugin &amp; Skill Manager</h1><span id="app-version" style="display:block;font-size:12px;line-height:1.5;color:var(--muted)">版本 / Version <!-- APP_VERSION --></span><p>查看本地技能文件与来源证据。</p></header>
<section id="workspace-panel"></section>
<section id="activity-panel" aria-label="使用活动热力图与排名"></section>

</main><script>/* APP_BUNDLE */</script></body></html>
