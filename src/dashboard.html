<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plugin &amp; Skill Manager</title>
<style>
:root{color-scheme:light dark;--paper:#ffffff;--surface:#f3f5f7;--ink:#20252b;--muted:#657182;--line:#d5dbe2;--line-soft:#eef0f3;--input-line:#aeb8c4;--accent:#245eaa;--accent-soft:#eaf3ff;--focus:#183b6b;--heat-0:#f0eef4;--heat-1:#e2d6f1;--heat-2:#bca0da;--heat-3:#9268bf;--heat-4:#694096}
@media(prefers-color-scheme:dark){:root{--paper:#202124;--surface:#292c30;--ink:#eceff2;--muted:#adb6c2;--line:#414850;--line-soft:#31373d;--input-line:#6e7b89;--accent:#9cc4f3;--accent-soft:#283a50;--focus:#a8cef5;--heat-0:#302c37;--heat-1:#514060;--heat-2:#785892;--heat-3:#a17bc0;--heat-4:#cba8e7}}
@media(prefers-reduced-motion:reduce){button{transition:none}}

:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--surface)}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:32px 24px}header{border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:28px;margin:8px 0}h2{font-size:18px;margin:0}p{line-height:1.7}small{color:var(--accent);font-weight:600;letter-spacing:.08em}.notice{padding:14px 18px;background:#fff4dd;color:#71420d;border-left:3px solid #925b12}#status{color:var(--muted);font-size:14px}ul{list-style:none;padding:0}li{padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:8px;margin:12px 0}li p{margin:8px 0 0}footer{font-size:13px;color:var(--muted)}@media(max-width:420px){main{padding:20px 14px}h1{font-size:24px}}
input,select{display:block;width:100%;padding:10px 12px;margin:6px 0 16px;border:1px solid var(--input-line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}details{margin-top:14px}summary{cursor:pointer;color:var(--accent)}details p{overflow-wrap:anywhere;font-size:13px}input:focus,select:focus,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font:inherit;font-size:13px;font-weight:500;line-height:20px;cursor:pointer;transition:background-color .12s,border-color .12s}
button:not(.heat-cell):hover:not(:disabled){background:var(--surface);border-color:var(--input-line)}button:not(.heat-cell):active:not(:disabled){background:var(--accent-soft)}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#management-plan p,#archives p{overflow-wrap:anywhere}
textarea{display:block;width:100%;min-height:90px;margin:8px 0;padding:10px;font:inherit;border:1px solid var(--input-line);border-radius:6px}input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 12px 0}textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
body{background:var(--paper)}main{max-width:1040px}header{padding-bottom:16px;margin-bottom:28px}header small{display:none}
#activity-panel{margin:0 0 32px}.activity-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.activity-heading h2{margin-right:auto;font-size:20px}.activity-tabs{display:flex;gap:4px;background:var(--surface);border-radius:8px;padding:4px}.activity-tabs button{border:0;min-height:30px;background:transparent;color:var(--muted);padding:7px 15px}.activity-tabs button[aria-pressed=true]{background:var(--paper);color:var(--accent);box-shadow:0 1px 2px #0000000a}.activity-heading select{width:auto;margin:0;padding:7px 9px;font-size:13px}.activity-caption,.activity-note{font-size:12px;color:var(--muted);line-height:1.7}.calendar-scroll{overflow-x:auto;padding:8px 0}.activity-calendar{min-width:710px}.calendar-months{display:grid;grid-template-columns:repeat(var(--weeks),1fr);height:24px;font-size:11px;color:var(--muted)}.calendar-months span{overflow:visible;white-space:nowrap}.calendar-cells{display:grid;grid-template-rows:repeat(7,12px);grid-template-columns:repeat(var(--weeks),1fr);grid-auto-flow:column;gap:3px}.heat-cell,.heat-empty,.heat-swatch{border-radius:3px;min-width:0;padding:0;border:0}.heat-cell{display:block;width:100%;height:12px;min-height:0;cursor:pointer;transition:none}.heat-cell:hover:not(:disabled){outline:2px solid var(--focus);outline-offset:1px}.level-0{background:var(--heat-0)}.level-1{background:var(--heat-1)}.level-2{background:var(--heat-2)}.level-3{background:var(--heat-3)}.level-4{background:var(--heat-4)}.heat-unknown{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 3px,var(--line) 3px,var(--line) 4px)}.activity-tooltip{font-size:12px;min-height:21px;color:var(--muted);margin:8px 0}.activity-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;color:var(--muted);font-size:11px}.heat-swatch{display:inline-block;width:12px;height:12px}.activity-legend span:last-child{margin-left:14px}.activity-rankings{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:26px}.activity-rankings h3{font-size:14px;font-weight:600;margin:0 0 12px}.activity-ranking{list-style:none;padding:0;margin:0}.activity-ranking li{display:flex;align-items:center;gap:10px;padding:10px 0;margin:0;border:0;border-radius:0;border-bottom:1px solid var(--line-soft);min-width:0}.activity-avatar{display:grid;place-items:center;flex:0 0 34px;height:34px;border:1px solid var(--line);border-radius:9px;color:var(--accent);background:var(--surface);font-size:12px;font-weight:600}.activity-ranking li>div{min-width:0;flex:1}.activity-ranking strong{display:block;font-size:13px;overflow-wrap:anywhere}.ranking-detail{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.ranking-count{font-size:12px;white-space:nowrap;color:var(--accent)}@media(max-width:600px){.activity-rankings{grid-template-columns:1fr;gap:22px}.activity-heading h2{width:100%}.activity-caption{max-width:100%}}
.entity-panel{margin-top:26px;padding-top:20px;border-top:1px solid var(--line-soft)}.entity-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.entity-heading h3{margin:0;font-size:15px}.entity-dates{display:flex;gap:10px;flex-wrap:wrap}.entity-dates label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.entity-dates input{width:auto;margin:0;padding:6px 8px;font-size:12px}.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,20px);gap:5px;margin-top:14px}.entity-cell{height:20px;width:20px}.entity-cell:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.manager-nav{display:flex;gap:6px;margin:-10px 0 24px;border-bottom:1px solid var(--line);padding-bottom:12px}.manager-nav button{border-color:transparent;background:transparent;color:var(--muted)}.manager-nav button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}.manager-body>button{margin:4px 8px 8px 0}.manager-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.manager-actions{display:flex;gap:8px;flex-wrap:wrap}.manager-body>p{font-size:14px;color:var(--muted);max-width:76ch}.manager-filters{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}.manager-meta{font-size:12px;color:var(--muted)}.manager-list h3{margin:0;font-size:16px}.manager-list details button,.manager-plan button{margin:8px 8px 0 0}.manager-plan{border-left:3px solid var(--accent);padding:14px 18px;background:var(--accent-soft);margin:16px 0}.manager-plan p,.archive-row p{overflow-wrap:anywhere;font-size:13px}.archive-row{padding:16px 0;border-bottom:1px solid var(--line)}.manager-feedback{font-size:13px;overflow-wrap:anywhere}.manager-feedback:empty{display:none}[hidden]{display:none!important}@media(max-width:600px){.manager-filters{grid-template-columns:1fr;gap:0}}
.observation-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.observation-heading h3{margin:0}.observation-check{flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;line-height:1.5;min-height:26px}.observation-check:hover{background:var(--surface);color:var(--muted)}.observation-state{font-size:13px;font-weight:600;margin:0 0 4px}.usage-observation>.activity-caption{margin:0 0 12px}.usage-observation>details{margin-top:10px;font-size:12px}.usage-observation>.activity-note{margin:8px 0;font-size:11px}.observation-rules summary{color:var(--muted);font-size:11px}.observation-feedback{font-size:12px;color:var(--muted)}.observation-feedback:empty{display:none}
.source-summary{width:100%;border-collapse:collapse;margin-top:24px;font-size:14px;table-layout:fixed}.source-summary th{padding:0 14px 10px;text-align:left;font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line)}.source-summary th:last-child{text-align:right}.source-summary td{padding:0;border-bottom:1px solid var(--line-soft)}.source-summary .source-choice{display:flex;justify-content:space-between;width:100%;min-height:46px;padding:12px 14px;border:0;border-radius:0;background:transparent;color:var(--ink);font-size:14px;font-weight:400;text-align:left}.source-summary .source-choice[aria-pressed=true]{background:var(--surface);box-shadow:inset 2px 0 var(--muted);font-weight:600}.source-summary .source-choice:hover:not(:disabled){background:var(--surface)}.source-summary .source-choice:focus-visible{outline-offset:-2px}.source-count{font-variant-numeric:tabular-nums;padding-left:18px}.source-total .source-choice{font-weight:600}.source-total td{border-top:1px solid var(--line);border-bottom:0}.source-hint{font-size:12px!important;color:var(--muted);margin:12px 0 26px}.manager-filters{grid-template-columns:minmax(0,1fr) minmax(180px,330px);align-items:end;gap:18px}.manager-filters label{font-size:12px;color:var(--muted)}.manager-filters input{margin-bottom:0;font-size:13px;padding:8px 10px}.source-list-heading{font-size:16px;margin:0 0 9px;font-weight:600}.manager-list{margin-top:8px}.manager-list>li{border:0;border-bottom:1px solid var(--line-soft);border-radius:0;padding:18px 0;margin:0}.manager-list>li p{font-size:13px}.manager-list h3{font-size:15px}.manager-list .manager-meta{font-size:12px}.manager-list+ h2{margin-top:28px}@media(max-width:600px){.manager-filters{grid-template-columns:1fr;gap:4px}.source-summary .source-choice{font-size:13px;padding:12px 10px}.source-summary th{padding-left:10px;padding-right:10px}.source-list-heading{margin-bottom:8px}}
</style></head><body><main>
<header><small>PLUGIN &amp; SKILL MANAGER / LOCAL</small><h1>Plugin &amp; Skill Manager</h1><span id="app-version" style="display:block;font-size:12px;line-height:1.5;color:var(--muted)">版本 / Version <!-- APP_VERSION --></span><p>查看本地技能文件与来源证据。</p></header>
<section id="workspace-panel"></section>
<section id="activity-panel" aria-label="使用活动热力图与排名"></section>
<p id="status" role="status">正在读取统计…</p>
</main><script>/* APP_BUNDLE */</script></body></html>
